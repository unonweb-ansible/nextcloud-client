---
# ~/.local/share/icons/hicolor/${size}/apps

# flatpak install
- when: nextcloud_client_flatpak_state != None
  name: Flatpak -> {{ nextcloud_client_flatpak_state }}
  become: true
  community.general.flatpak:
    name: "{{ __nextcloud_client_flatpak_id }}"
    method: system
    state: "{{ nextcloud_client_flatpak_state }}"

# flatpak overrides
- when: nextcloud_client_flatpak_overrides != None
  tags: nextcloud-client-overrides
  block:

  # mkdir overrides
  - name: Mkdir {{ __nextcloud_client_flatpak_overrides_dir }}
    become: true
    ansible.builtin.file:
      state: directory
      mode: u=rwx,g=,o=rx
      owner: "{{ nextcloud_client_user }}"
      group: "{{ nextcloud_client_user }}"
      path: "{{ __nextcloud_client_flatpak_overrides_dir }}"

  # template override
  - name: Template overrides {{ __nextcloud_client_flatpak_overrides_dir }}/{{ __nextcloud_client_flatpak_id }}
    become: true
    ansible.builtin.template:
      src: flatpak-overrides-generic.j2
      dest: "{{ __nextcloud_client_flatpak_overrides_dir }}/{{ __nextcloud_client_flatpak_id }}"
      owner: "{{ nextcloud_client_user }}"
      group: "{{ nextcloud_client_user }}"
      mode: u=rw,g=,o=r # world readable

# flatpak permissions
- when: nextcloud_client_flatpak_permissions | length > 0
  tags: nextcloud-client-flatpak-permissions
  block:

  # set permission
  - name: Set permissions
    ansible.builtin.command:
      cmd: "flatpak permission-set {{ item.table }} {{ item.id }} {{ __nextcloud_client_flatpak_id }} {{ item.value }}"
    loop: "{{ nextcloud_client_flatpak_permissions }}"
    changed_when: false

# nautilus integration
- when: nextcloud_client_flatpak_nautilus_integration == true
  tags: nextcloud-client-nautilus
  block:

  # python3-nautilus
  - name: Apt install python3-nautilus
    become: true
    ansible.builtin.apt:
      state: present
      name: python3-nautilus

  # copy icons
  - name: Copy icons for nautilus-integration to /home/{{ nextcloud_client_user }}/.local/share/icons/hicolor/ ...
    loop:
    - 16x16
    - 32x32
    - 48x48
    - 64x64
    - 128x128
    - 256x256
    become: true
    ansible.builtin.copy:
      src: "nautilus-integration/icons/{{ item }}/"
      dest: "/home/{{ nextcloud_client_user }}/.local/share/icons/hicolor/{{ item }}/apps/"
      owner: "{{ nextcloud_client_user }}"
      group: "{{ nextcloud_client_user }}"
      mode: u=rw,g=,o=r # world readable

  # mkdir nautlius integration script
  - name: Mkdir /home/{{ nextcloud_client_user }}/.local/share/nautilus-python/extensions
    become: true
    ansible.builtin.file:
      state: directory
      mode: u=rwx,g=,o=
      path: "/home/{{ nextcloud_client_user }}/.local/share/nautilus-python/extensions"
      owner: "{{ nextcloud_client_user }}"
      group: "{{ nextcloud_client_user }}"

  # copy script
  - name: Copy script to /home/{{ nextcloud_client_user }}/.local/share/nautilus-python/extensions/nextcloud-syncstate.py
    become: true
    ansible.builtin.copy:
      src: "nautilus-integration/{{ nextcloud_client_flatpak_nautilus_syncstate }}"
      dest: "/home/{{ nextcloud_client_user }}/.local/share/nautilus-python/extensions/nextcloud-syncstate.py"
      owner: "{{ nextcloud_client_user }}"
      group: "{{ nextcloud_client_user }}"
      mode: u=rw,g=,o=r # world readable

  # copy script
  - name: Copy script to /usr/share/nautilus-python/extensions/nextcloud-syncstate.py
    become: true
    ansible.builtin.copy:
      src: "nautilus-integration/{{ nextcloud_client_flatpak_nautilus_syncstate }}"
      dest: "/usr/share/nautilus-python/extensions/nextcloud-syncstate.py"
      owner: root
      group: root
      mode: u=rw,g=,o=r # world readable

# dbus integration
- when: nextcloud_client_dbus_prevent_trigger == true
  tags: nextcloud-client-dbus
  block:

  # mkdir dbus integration
  - name: Mkdir {{ __nextcloud_client_flatpak_exports_dbus_services_dir }}
    become: true
    ansible.builtin.file:
      state: directory
      mode: u=rwx,g=,o=
      path: "{{ __nextcloud_client_flatpak_exports_dbus_services_dir }}"
      owner: "{{ nextcloud_client_user }}"
      group: "{{ nextcloud_client_user }}"

  # copy dbus prevention
  - name: Copy dbus prevention config to {{ __nextcloud_client_flatpak_exports_dbus_services_dir }}/com.nextcloudgmbh.Nextcloud.service
    become: true
    ansible.builtin.copy:
      src: "dbus/com.nextcloudgmbh.Nextcloud.service"
      dest: "{{ __nextcloud_client_flatpak_exports_dbus_services_dir }}/com.nextcloudgmbh.Nextcloud.service"
      owner: "{{ nextcloud_client_user }}"
      group: "{{ nextcloud_client_user }}"
      mode: u=rw,g=,o=r
  
